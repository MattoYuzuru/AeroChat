version: "3"

tasks:
  tools:
    desc: Устанавливает локальные dev-инструменты в ./bin
    cmds:
      - ./infra/scripts/install-dev-tools.sh

  proto:lint:
    desc: Проверяет protobuf-контракты через Buf
    cmds:
      - '"{{.ROOT_DIR}}/bin/buf" lint'

  proto:generate:
    desc: Генерирует Go и ConnectRPC код из protobuf-контрактов
    cmds:
      - '"{{.ROOT_DIR}}/bin/buf" generate'

  sqlc:generate:
    desc: Генерирует типизированный Go-код из SQL-запросов
    cmds:
      - '"{{.ROOT_DIR}}/bin/sqlc" generate'

  generated:check:
    desc: Генерирует Buf/SQLC код и отклоняет drift относительно HEAD
    cmds:
      - 'PATH="{{.ROOT_DIR}}/bin:$PATH" sh infra/scripts/check-generated.sh'

  go:fmt:
    desc: Форматирует Go-код во всех workspace-модулях
    cmds:
      - gofmt -w $(find . -type f -name '*.go' -not -path './gen/go/*')

  go:test:
    desc: Запускает Go-тесты через go.work
    cmds:
      - go test ./libs/go/... ./services/aero-gateway/... ./services/aero-identity/... ./services/aero-chat/... ./services/aero-rtc-control/... ./services/aero-jobs/... ./gen/go/...

  go:lint:
    desc: Запускает golangci-lint по всем Go-модулям
    cmds:
      - '"{{.ROOT_DIR}}/bin/golangci-lint" run ./libs/go/... ./services/aero-gateway/... ./services/aero-identity/... ./services/aero-chat/... ./services/aero-rtc-control/... ./services/aero-jobs/... ./gen/go/...'

  web:install:
    desc: Устанавливает frontend-зависимости
    cmds:
      - npx pnpm@10.19.0 install --frozen-lockfile

  web:lint:
    desc: Запускает lint для web-приложения
    cmds:
      - npx pnpm@10.19.0 --filter @aerochat/web lint

  web:build:
    desc: Собирает web-приложение
    cmds:
      - npx pnpm@10.19.0 --filter @aerochat/web build

  web:test:
    desc: Запускает тесты web-приложения
    cmds:
      - npx pnpm@10.19.0 --filter @aerochat/web test

  compose:config:
    desc: Проверяет docker compose-конфигурацию
    cmds:
      - docker compose --env-file .env.example -f infra/compose/docker-compose.yml config --quiet

  compose:server:config:
    desc: Проверяет server/prod-like compose-конфигурацию
    cmds:
      - docker compose --env-file .env.server.example --env-file .env.server.secrets.example -f infra/compose/docker-compose.server.yml config --quiet

  compose:up:
    desc: Поднимает dev-окружение
    cmds:
      - docker compose -f infra/compose/docker-compose.yml up --build -d

  check:
    desc: Выполняет основной набор локальных проверок
    cmds:
      - task: tools
      - task: web:install
      - task: proto:lint
      - task: generated:check
      - task: go:test
      - task: go:lint
      - task: web:lint
      - task: web:test
      - task: web:build
      - task: compose:config
      - task: compose:server:config
