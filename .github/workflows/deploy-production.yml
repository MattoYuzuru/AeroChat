name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_digest:
        description: "Immutable OCI digest AeroChat release manifest (sha256:...)"
        required: true
        type: string
      source_sha:
        description: "Точный source commit SHA из Publish Images summary"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-rollout
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RELEASE_DIGEST: ${{ inputs.release_digest }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      DEPLOY_DIR: ${{ vars.AERO_PROD_DEPLOY_DIR }}
      COMPOSE_FILE: ${{ vars.AERO_PROD_COMPOSE_FILE }}
      EDGE_DOMAIN: ${{ vars.AERO_PROD_EDGE_DOMAIN }}
      MEDIA_EDGE_DOMAIN: ${{ vars.AERO_PROD_MEDIA_EDGE_DOMAIN }}
      SSH_HOST: ${{ secrets.AERO_PROD_SSH_HOST }}
      SSH_PORT: ${{ secrets.AERO_PROD_SSH_PORT }}
      SSH_USER: ${{ secrets.AERO_PROD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.AERO_PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.AERO_PROD_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate rollout inputs
        run: |
          set -euo pipefail

          required_vars=(
            RELEASE_DIGEST
            SOURCE_SHA
            DEPLOY_DIR
            COMPOSE_FILE
            EDGE_DOMAIN
            MEDIA_EDGE_DOMAIN
            SSH_HOST
            SSH_PORT
            SSH_USER
            SSH_PRIVATE_KEY
            SSH_KNOWN_HOSTS
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Переменная ${name} не задана"
              exit 1
            fi
          done

          if ! printf '%s' "$RELEASE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::release_digest должен быть полным OCI SHA-256 digest"
            exit 1
          fi

          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha должен быть полным commit SHA"
            exit 1
          fi

          if ! printf '%s' "$EDGE_DOMAIN" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "::error::AERO_PROD_EDGE_DOMAIN содержит недопустимые символы"
            exit 1
          fi

          if ! printf '%s' "$MEDIA_EDGE_DOMAIN" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "::error::AERO_PROD_MEDIA_EDGE_DOMAIN содержит недопустимые символы"
            exit 1
          fi

      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
          url: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          checksum: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64

      - name: Validate immutable release before SSH
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          release_repo="$namespace/aerochat-release"
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras manifest fetch "$release_repo@$RELEASE_DIGEST" --output "$RUNNER_TEMP/release-oci.json"
          layer="$(python3 infra/scripts/release_manifest.py artifact "$RUNNER_TEMP/release-oci.json" --source-sha "$SOURCE_SHA")"
          oras blob fetch "$release_repo@$layer" --output "$RUNNER_TEMP/release.json"
          python3 infra/scripts/release_manifest.py validate "$RUNNER_TEMP/release.json" --source-sha "$SOURCE_SHA" --namespace "$namespace" --overlay "$RUNNER_TEMP/release-compose.json"

      - name: Prepare SSH material
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aero_prod_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/aero_prod_known_hosts"

      - name: Roll out selected immutable release
        run: |
          set -euo pipefail

          ssh_opts=(
            -i "$RUNNER_TEMP/aero_prod_key"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/aero_prod_known_hosts"
            -p "$SSH_PORT"
          )

          ssh_command=(
            bash
            -s
            --
            "$DEPLOY_DIR"
            "$COMPOSE_FILE"
            "$RELEASE_DIGEST"
            "$SOURCE_SHA"
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            "$EDGE_DOMAIN"
            "$MEDIA_EDGE_DOMAIN"
          )

          scp -i "$RUNNER_TEMP/aero_prod_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/aero_prod_known_hosts" -P "$SSH_PORT" "$RUNNER_TEMP/release.json" "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/release-${SOURCE_SHA}.json"

          # shellcheck disable=SC2029
          # Аргументы передаются в remote `bash -s -- ...` намеренно и не используются как часть shell-кода.
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "${ssh_command[@]}" <<'REMOTE'
          set -euo pipefail

          DEPLOY_DIR=$1
          COMPOSE_FILE=$2
          RELEASE_DIGEST=$3
          SOURCE_SHA=$4
          IMAGE_NAMESPACE=$5
          EDGE_DOMAIN=$6
          MEDIA_EDGE_DOMAIN=$7

          require_command() {
            local name="$1"
            if ! command -v "$name" >/dev/null 2>&1; then
              echo "Команда $name не найдена на сервере" >&2
              exit 1
            fi
          }

          wait_for_url() {
            local description="$1"
            local url="$2"
            shift 2

            local attempt=1
            while [ "$attempt" -le 30 ]; do
              if curl -fsS "$@" "$url" >/dev/null; then
                echo "$description: ok"
                return 0
              fi

              sleep 2
              attempt=$((attempt + 1))
            done

            echo "$description: failed" >&2
            return 1
          }

          read_env_var() {
            local file="$1"
            local key="$2"
            local line

            line="$(grep -m1 "^${key}=" "$file" || true)"
            if [ -z "$line" ]; then
              echo "Переменная ${key} не найдена в ${file}" >&2
              exit 1
            fi

            printf '%s\n' "${line#*=}"
          }

          read_optional_env_var() {
            local file="$1"
            local key="$2"
            local line

            line="$(grep -m1 "^${key}=" "$file" || true)"
            if [ -z "$line" ]; then
              printf '\n'
              return 0
            fi

            printf '%s\n' "${line#*=}"
          }

          update_env_var() {
            local file="$1"
            local key="$2"
            local value="$3"

            if grep -q "^${key}=" "$file"; then
              sed -i "s#^${key}=.*#${key}=${value}#" "$file"
              return
            fi

            printf '\n%s=%s\n' "$key" "$value" >> "$file"
          }

          require_command bash
          require_command curl
          require_command docker
          require_command grep
          require_command sed
          require_command git
          require_command python3

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin не найден на сервере" >&2
            exit 1
          fi

          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Deployment checkout должен соответствовать выбранному source SHA" >&2
            exit 1
          fi

          RELEASE_OVERLAY="release-compose-${SOURCE_SHA}.json"
          python3 infra/scripts/release_manifest.py validate "release-${SOURCE_SHA}.json" --source-sha "$SOURCE_SHA" --namespace "$IMAGE_NAMESPACE" --overlay "$RELEASE_OVERLAY"

          if [ ! -f .env.server ]; then
            echo ".env.server не найден в $DEPLOY_DIR" >&2
            exit 1
          fi

          if [ ! -f .env.server.secrets ]; then
            echo ".env.server.secrets не найден в $DEPLOY_DIR" >&2
            exit 1
          fi

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Compose file $COMPOSE_FILE не найден в $DEPLOY_DIR" >&2
            exit 1
          fi

          shared_edge_host_ip="$(read_env_var .env.server AERO_SHARED_EDGE_HOST_IP)"
          web_host_port="$(read_env_var .env.server AERO_WEB_HOST_PORT)"
          gateway_host_port="$(read_env_var .env.server AERO_GATEWAY_HOST_PORT)"
          media_host_port="$(read_env_var .env.server AERO_MEDIA_HOST_PORT)"
          web_push_subscriber="$(read_optional_env_var .env.server AERO_WEB_PUSH_SUBSCRIBER)"
          web_push_public_key="$(read_optional_env_var .env.server AERO_WEB_PUSH_VAPID_PUBLIC_KEY)"
          web_push_private_key="$(read_optional_env_var .env.server.secrets AERO_WEB_PUSH_VAPID_PRIVATE_KEY)"

          if [ "$shared_edge_host_ip" = "127.0.0.1" ]; then
            echo "AERO_SHARED_EDGE_HOST_IP не должен оставаться loopback для shared Traefik edge" >&2
            exit 1
          fi

          web_push_values_set=0
          if [ -n "$web_push_subscriber" ]; then
            web_push_values_set=$((web_push_values_set + 1))
          fi
          if [ -n "$web_push_public_key" ]; then
            web_push_values_set=$((web_push_values_set + 1))
          fi
          if [ -n "$web_push_private_key" ]; then
            web_push_values_set=$((web_push_values_set + 1))
          fi

          if [ "$web_push_values_set" -eq 0 ]; then
            echo "::warning::AERO_WEB_PUSH_* не заданы: browser push останется отключённым на production"
          elif [ "$web_push_values_set" -ne 3 ]; then
            echo "Неполная web push конфигурация: должны быть заданы AERO_WEB_PUSH_SUBSCRIBER, AERO_WEB_PUSH_VAPID_PUBLIC_KEY и AERO_WEB_PUSH_VAPID_PRIVATE_KEY" >&2
            exit 1
          fi

          echo "Выбран immutable release $RELEASE_DIGEST source $SOURCE_SHA"

          docker compose \
            --env-file .env.server \
            --env-file .env.server.secrets \
            -f "$COMPOSE_FILE" -f "$RELEASE_OVERLAY" \
            config >/dev/null

          docker compose \
            --env-file .env.server \
            --env-file .env.server.secrets \
            -f "$COMPOSE_FILE" -f "$RELEASE_OVERLAY" \
            pull --ignore-buildable

          docker compose \
            --env-file .env.server \
            --env-file .env.server.secrets \
            -f "$COMPOSE_FILE" -f "$RELEASE_OVERLAY" \
            up -d

          docker compose \
            --env-file .env.server \
            --env-file .env.server.secrets \
            -f "$COMPOSE_FILE" -f "$RELEASE_OVERLAY" \
            ps

          wait_for_url "Web upstream" "http://${shared_edge_host_ip}:${web_host_port}/"
          python3 infra/scripts/release_manifest.py runtime "release-${SOURCE_SHA}.json" --source-sha "$SOURCE_SHA" --namespace "$IMAGE_NAMESPACE" --compose-file "$COMPOSE_FILE" --overlay "$RELEASE_OVERLAY" --env-file .env.server --env-file .env.server.secrets
          wait_for_url "Gateway upstream readyz" "http://${shared_edge_host_ip}:${gateway_host_port}/readyz"
          wait_for_url "Media upstream live" "http://${shared_edge_host_ip}:${media_host_port}/minio/health/live"
          wait_for_url "HTTPS web root" "https://${EDGE_DOMAIN}/"
          wait_for_url "HTTPS healthz" "https://${EDGE_DOMAIN}/healthz"
          wait_for_url "HTTPS readyz" "https://${EDGE_DOMAIN}/readyz"
          wait_for_url "HTTPS media live" "https://${MEDIA_EDGE_DOMAIN}/minio/health/live"

          actual_source="$(curl -fsS "http://${shared_edge_host_ip}:${gateway_host_port}/readyz" | python3 -c 'import json,sys; print(json.load(sys.stdin)["service"]["version"])')"
          if [ "$actual_source" != "$SOURCE_SHA" ]; then
            echo "Gateway readiness не подтверждает выбранный source SHA" >&2
            exit 1
          fi

          update_env_var .env.server AERO_RELEASE_DIGEST "$RELEASE_DIGEST"
          update_env_var .env.server AERO_RELEASE_SOURCE_SHA "$SOURCE_SHA"
          echo "Rollback: выберите предыдущую пару release digest/source SHA и сохранённый release-compose JSON"
          REMOTE

      - name: Write job summary
        run: |
          {
            echo "## Production rollout"
            echo
            echo "- image_tag: \`$IMAGE_TAG\`"
            echo "- deploy dir: \`$DEPLOY_DIR\`"
            echo "- domain: \`$EDGE_DOMAIN\`"
            echo "- media domain: \`$MEDIA_EDGE_DOMAIN\`"
          } >> "$GITHUB_STEP_SUMMARY"
