name: CI

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "infra/**"
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Validate workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Verify release metadata negative fixtures
        run: python3 -B infra/scripts/test_release_manifest.py

      - name: Verify recovery policy negative fixtures
        run: python3 -B infra/scripts/test_recovery.py

      - name: Verify Go lifecycle source pins
        run: python3 -B infra/scripts/go_lifecycle.py check

      - name: Verify vulnerability gate negative fixtures
        run: python3 -B infra/scripts/test_go_vuln.py

      - name: Validate local compose
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml config >/dev/null

      - name: Validate server compose
        run: docker compose --env-file .env.server.example --env-file .env.server.secrets.example -f infra/compose/docker-compose.server.yml config >/dev/null

  images:
    needs: [workflows, infra, go, go-vuln, web, proto]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
            build_args: --build-arg VITE_GATEWAY_BASE_URL=/api
          - service: aero-gateway
            dockerfile: services/aero-gateway/Dockerfile
            build_args: ""
          - service: aero-identity
            dockerfile: services/aero-identity/Dockerfile
            build_args: ""
          - service: aero-chat
            dockerfile: services/aero-chat/Dockerfile
            build_args: ""
          - service: aero-rtc-control
            dockerfile: services/aero-rtc-control/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate release image build
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p /tmp/release-images
          read -r -a image_build_flags <<< "$BUILD_ARGS"
          docker buildx build "${image_build_flags[@]}" --build-arg AERO_BUILD_REVISION="$EXPECTED_SOURCE_SHA" --label "org.opencontainers.image.revision=$EXPECTED_SOURCE_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --platform linux/amd64 -f "$DOCKERFILE" -t "$namespace/aerochat-$SERVICE:sha-$EXPECTED_SOURCE_SHA" --output "type=docker,dest=/tmp/release-images/$SERVICE.tar" .

      - name: Preserve exact image for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ env.EXPECTED_SOURCE_SHA }}-${{ matrix.service }}
          path: /tmp/release-images/${{ matrix.service }}.tar
          retention-days: 7

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Sync workspace
        run: |
          go work sync
          git diff --exit-code -- go.work go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

      - name: Check formatting
        run: |
          unformatted_files="$(find . -type f -name '*.go' -not -path './gen/go/*' -exec gofmt -l {} +)"

          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            echo "Найдены неотформатированные Go-файлы"
            exit 1
          fi

      - name: Run tests
        run: go test ./libs/go/... ./services/aero-gateway/... ./services/aero-identity/... ./services/aero-chat/... ./services/aero-rtc-control/... ./services/aero-jobs/... ./gen/go/...

      - name: Run golangci-lint
        run: |
          lint_version="$(python3 -B infra/scripts/go_lifecycle.py get golangci_lint_version)"
          GOBIN="$RUNNER_TEMP/go-lint-bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$lint_version"
          "$RUNNER_TEMP/go-lint-bin/golangci-lint" run ./libs/go/... ./services/aero-gateway/... ./services/aero-identity/... ./services/aero-chat/... ./services/aero-rtc-control/... ./services/aero-jobs/... ./gen/go/...

  go-vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Install pinned vulnerability scanner
        run: |
          scanner_version="$(python3 -B infra/scripts/go_lifecycle.py get govulncheck_version)"
          GOBIN="$RUNNER_TEMP/go-vuln-bin" go install "golang.org/x/vuln/cmd/govulncheck@v$scanner_version"

      - name: Scan all workspace modules on frozen SHA
        run: python3 -B infra/scripts/check-go-vuln.py --source-sha "$EXPECTED_SOURCE_SHA" --scanner "$RUNNER_TEMP/go-vuln-bin/govulncheck" --output-dir "$RUNNER_TEMP/go-vuln-evidence"

      - name: Preserve vulnerability diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-vuln-${{ env.EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/go-vuln-evidence
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @aerochat/web lint

      - name: Test web
        run: pnpm --filter @aerochat/web test

      - name: Build web
        run: pnpm --filter @aerochat/web build

  proto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.59.0
          github_token: ${{ github.token }}

      - name: Buf lint
        run: buf lint

      - name: Buf generate
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sh infra/scripts/test-generated-drift.sh
          sh infra/scripts/check-generated.sh
