name: Publish Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: image-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.sha }}

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Retrieve all verified images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-${{ github.sha }}-*
          path: /tmp/release-images
          merge-multiple: true

      - name: Validate complete image set before any publication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for service in web aero-gateway aero-identity aero-chat aero-rtc-control; do
            test -f "/tmp/release-images/$service.tar"
            docker load -i "/tmp/release-images/$service.tar"
            test "$(docker image inspect "$namespace/aerochat-$service:sha-$SOURCE_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          done

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
          url: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz
          checksum: 6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64

      - name: Publish immutable images and finalize one release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p /tmp/release-digests /tmp/release-manifest
          for service in web aero-gateway aero-identity aero-chat aero-rtc-control; do
            image="$namespace/aerochat-$service:sha-$SOURCE_SHA"
            docker push "$image"
            docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "/tmp/release-digests/$service.txt"
          done
          python3 infra/scripts/release_manifest.py assemble /tmp/release-digests --source-sha "$SOURCE_SHA" --namespace "$namespace" > /tmp/release-manifest/release.json
          cd /tmp/release-manifest
          oras push "$namespace/aerochat-release:sha-$SOURCE_SHA" --artifact-type application/vnd.aerochat.release.v1+json --annotation "org.opencontainers.image.revision=$SOURCE_SHA" release.json:application/vnd.aerochat.release.v1+json
          digest="$(oras resolve "$namespace/aerochat-release:sha-$SOURCE_SHA")"
          # shellcheck disable=SC2016
          printf 'Release: `%s/aerochat-release@%s`\n\nSource SHA: `%s`\n' "$namespace" "$digest" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
