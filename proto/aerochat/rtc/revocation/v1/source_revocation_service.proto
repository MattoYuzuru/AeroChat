syntax = "proto3";

package aerochat.rtc.revocation.v1;

option go_package = "github.com/MattoYuzuru/AeroChat/gen/go/aerochat/rtc/revocation/v1;rtcrevocationv1";

// Сервис доступен только owning-domain caller на private mTLS listener.
service SourceRevocationService {
  rpc ApplyIdentityEvent(ApplyIdentityEventRequest) returns (ApplyIdentityEventResponse);
  rpc ApplyChatEvent(ApplyChatEventRequest) returns (ApplyChatEventResponse);
  rpc GetIdentityEventReceipt(GetIdentityEventReceiptRequest) returns (GetIdentityEventReceiptResponse);
  rpc GetChatEventReceipt(GetChatEventReceiptRequest) returns (GetChatEventReceiptResponse);
}

enum IdentityEventKind {
  IDENTITY_EVENT_KIND_UNSPECIFIED = 0;
  IDENTITY_EVENT_KIND_SESSION = 1;
  IDENTITY_EVENT_KIND_DEVICE = 2;
}

enum SourceReceiptStatus {
  SOURCE_RECEIPT_STATUS_UNSPECIFIED = 0;
  SOURCE_RECEIPT_STATUS_DURABLY_APPLIED = 1;
}

// Эти states не утверждают отсутствие SFU/RTP или завершение media.
enum RegistryMediaEffect {
  REGISTRY_MEDIA_EFFECT_UNSPECIFIED = 0;
  REGISTRY_MEDIA_EFFECT_NO_MATCHING_REGISTRY_GRANTS = 1;
  REGISTRY_MEDIA_EFFECT_MEDIA_PENDING = 2;
}

message SourceEventReceipt {
  string event_id = 1;
  string operation_id = 2;
  SourceReceiptStatus source_receipt = 3;
  RegistryMediaEffect registry_media_effect = 4;
  uint32 affected_registry_grants = 5;
}

message ApplyIdentityEventRequest {
  string event_id = 1;
  IdentityEventKind kind = 2;
  string subject_id = 3;
  string user_id = 4;
  string device_id = 5;
  int64 source_revision = 6;
}

message ApplyIdentityEventResponse {
  SourceEventReceipt receipt = 1;
}

// Оба Chat audit reason канонически становятся одним group-denied tuple.
message ApplyChatEventRequest {
  string event_id = 1;
  string group_id = 2;
  string user_id = 3;
  int64 eligibility_epoch = 4;
}

message ApplyChatEventResponse {
  SourceEventReceipt receipt = 1;
}

message GetIdentityEventReceiptRequest {
  string event_id = 1;
}

message GetIdentityEventReceiptResponse {
  SourceEventReceipt receipt = 1;
}

message GetChatEventReceiptRequest {
  string event_id = 1;
}

message GetChatEventReceiptResponse {
  SourceEventReceipt receipt = 1;
}
